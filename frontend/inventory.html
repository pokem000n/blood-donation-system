<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Blood Inventory — HemoTrack</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title"><div class="page-icon">🩸</div><h1>Blood Inventory</h1></div>
    <div class="topbar-right">
      <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️</button>
      <div style="display:flex;gap:8px;font-size:12px;">
        <span class="badge badge-success">● OK ≥2000ml</span>
        <span class="badge badge-warning">● Low 1000–1999ml</span>
        <span class="badge badge-danger">⚡ Critical &lt;1000ml</span>
      </div>
    </div>
  </div>
  <div class="page-content">
    <div class="card">
      <div class="card-header"><h2>🩸 Stock Overview</h2></div>
      <div class="card-body">
        <div class="inventory-grid" id="inventory-grid">
          <div class="loader"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h2>Detailed Inventory</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Blood Group</th><th>Blood Bank / Hospital</th><th>Quantity (ml)</th><th>Status</th><th>Last Updated</th></tr></thead>
          <tbody id="inventory-tbody"><tr><td colspan="6"><div class="loader"><div class="spinner"></div></div></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script src="js/api.js"></script><script src="js/inventory.js"></script>
</body></html>
