<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Donors — HemoTrack</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title"><div class="page-icon">👤</div><h1>Donors</h1></div>
    <div class="topbar-right">
      <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️</button>
      <button class="btn btn-primary" onclick="openModal('modal-add-donor')">+ Add Donor</button>
    </div>
  </div>
  <div class="page-content">
    <div class="card">
      <div class="card-header">
        <h2>All Donors</h2>
        <div class="search-bar" style="margin:0;">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="Search by name, phone, blood group..." oninput="filterTable()"/>
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Donor</th><th>Gender</th><th>DOB</th><th>Phone</th><th>Blood Group</th><th>Donations</th><th>Last Donated</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="donors-tbody"><tr><td colspan="10"><div class="loader"><div class="spinner"></div></div></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add Donor Modal -->
<div class="modal-backdrop" id="modal-add-donor">
  <div class="modal">
    <div class="modal-header">
      <h3>👤 Add New Donor</h3>
      <button class="modal-close" onclick="closeModal('modal-add-donor')">✕</button>
    </div>
    <div class="modal-body">
      <form id="form-add-donor" onsubmit="addDonor(event)">
        <div class="form-grid-2">
          <div class="form-row">
            <label>Full Name *</label>
            <input type="text" class="form-control" name="name" placeholder="e.g. Arif Hossain" required/>
          </div>
          <div class="form-row">
            <label>Date of Birth *</label>
            <input type="date" class="form-control" name="dob" required/>
          </div>
          <div class="form-row">
            <label>Gender *</label>
            <select class="form-control" name="gender" required>
              <option value="">Select gender</option>
              <option>Male</option><option>Female</option><option>Other</option>
            </select>
          </div>
          <div class="form-row">
            <label>Phone *</label>
            <input type="text" class="form-control" name="phone" placeholder="01XXXXXXXXX" required/>
          </div>
          <div class="form-row">
            <label>Blood Group *</label>
            <select class="form-control" name="blood_group_id" id="donor-bg-select" required>
              <option value="">Select blood group</option>
            </select>
          </div>
          <div class="form-row">
            <label>Availability *</label>
            <select class="form-control" name="availability" required>
              <option value="Available">Available</option>
              <option value="Unavailable">Unavailable</option>
            </select>
          </div>
          <div class="form-row">
            <label>Email</label>
            <input type="email" class="form-control" name="email" placeholder="optional"/>
          </div>
          <div class="form-row">
            <label>Address</label>
            <input type="text" class="form-control" name="address" placeholder="City, Area"/>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-add-donor')">Cancel</button>
      <button class="btn btn-primary" onclick="document.getElementById('form-add-donor').requestSubmit()">Save Donor</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script><script src="js/donors.js"></script>
</body></html>
