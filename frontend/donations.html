<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Donations — HemoTrack</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title"><div class="page-icon">💉</div><h1>Donations</h1></div>
    <div class="topbar-right">
      <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️</button>
      <button class="btn btn-primary" onclick="openModal('modal-record-donation')">+ Record Donation</button>
    </div>
  </div>
  <div class="page-content">
    <div class="card">
      <div class="card-header"><h2>Donation History</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Donor</th><th>Blood Group</th><th>Date</th><th>Quantity (ml)</th><th>Certificate</th></tr></thead>
          <tbody id="donations-tbody"><tr><td colspan="6"><div class="loader"><div class="spinner"></div></div></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-record-donation">
  <div class="modal">
    <div class="modal-header">
      <h3>💉 Record Donation</h3>
      <button class="modal-close" onclick="closeModal('modal-record-donation')">✕</button>
    </div>
    <div class="modal-body">
      <form id="form-record-donation" onsubmit="recordDonation(event)">
        <div class="form-grid-2">
          <div class="form-row">
            <label>Donor *</label>
            <select class="form-control" name="donor_id" id="don-select" required><option value="">Loading...</option></select>
          </div>
          <div class="form-row">
            <label>Blood Group *</label>
            <select class="form-control" name="blood_group_id" id="don-bg-select" required><option value="">Loading...</option></select>
          </div>
          <div class="form-row">
            <label>Donation Date *</label>
            <input type="date" class="form-control" name="donation_date" required/>
          </div>
          <div class="form-row">
            <label>Quantity (ml) *</label>
            <input type="number" class="form-control" name="quantity" value="450" min="100" max="600" required/>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-record-donation')">Cancel</button>
      <button class="btn btn-primary" onclick="document.getElementById('form-record-donation').requestSubmit()">Record</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script><script src="js/donations.js"></script>
</body></html>
