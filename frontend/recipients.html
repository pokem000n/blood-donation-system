<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recipients — Blood Donation System</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="logo-icon">🩸</div><h2>Blood Donation<br>Management</h2></div>
  <nav>
    <div class="nav-section">Main</div>
    <a href="index.html"        class="nav-link"><span class="icon">🏠</span> Dashboard</a>
    <div class="nav-section">Manage</div>
    <a href="donors.html"       class="nav-link"><span class="icon">👤</span> Donors</a>
    <a href="recipients.html"   class="nav-link"><span class="icon">🏥</span> Recipients</a>
    <a href="donations.html"    class="nav-link"><span class="icon">💉</span> Donations</a>
    <a href="inventory.html"    class="nav-link"><span class="icon">🩸</span> Blood Inventory</a>
    <div class="nav-section">Requests</div>
    <a href="requests.html"     class="nav-link"><span class="icon">📋</span> Blood Requests</a>
    <a href="emergency.html"    class="nav-link"><span class="icon">🚨</span> Emergency</a>
    <a href="appointments.html" class="nav-link"><span class="icon">📅</span> Appointments</a>
  </nav>
</aside>

<div class="main">
  <div class="topbar">
    <h1>🏥 Recipients</h1>
    <div class="topbar-right">
      <button class="btn btn-primary" onclick="openModal('modal-add-recipient')">+ Add Recipient</button>
    </div>
  </div>
  <div class="page-content">
    <div class="card">
      <div class="card-header">
        <h2>All Recipients</h2>
        <div class="search-bar" style="margin:0;width:280px;">
          <input type="text" id="search-input" class="search-input" placeholder="Search by name, phone..." oninput="filterTable()"/>
        </div>
      </div>
      <div class="card-body" style="padding:0;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>Name</th><th>Gender</th><th>Age</th><th>Phone</th><th>Address</th><th>Total Requests</th></tr>
            </thead>
            <tbody id="recipients-tbody">
              <tr><td colspan="7" class="loader"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Recipient Modal -->
<div class="modal-backdrop" id="modal-add-recipient">
  <div class="modal">
    <div class="modal-header">
      <h3>➕ Add New Recipient</h3>
      <button class="modal-close" onclick="closeModal('modal-add-recipient')">✕</button>
    </div>
    <div class="modal-body">
      <form id="form-add-recipient" onsubmit="addRecipient(event)">
        <div class="form-grid-2">
          <div class="form-row">
            <label>Full Name *</label>
            <input type="text" class="form-control" name="name" required/>
          </div>
          <div class="form-row">
            <label>Gender *</label>
            <select class="form-control" name="gender" required>
              <option value="">Select...</option>
              <option>Male</option><option>Female</option><option>Other</option>
            </select>
          </div>
          <div class="form-row">
            <label>Age *</label>
            <input type="number" class="form-control" name="age" min="1" max="120" required/>
          </div>
          <div class="form-row">
            <label>Phone *</label>
            <input type="text" class="form-control" name="phone" required/>
          </div>
        </div>
        <div class="form-row">
          <label>Address</label>
          <input type="text" class="form-control" name="address"/>
        </div>
        <div class="modal-footer" style="padding:0;border:none;margin-top:16px;">
          <button type="button" class="btn btn-outline" onclick="closeModal('modal-add-recipient')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Recipient</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/recipients.js"></script>
</body>
</html>
