<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Recipients — HemoTrack</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title"><div class="page-icon">🏥</div><h1>Recipients</h1></div>
    <div class="topbar-right">
      <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️</button>
      <button class="btn btn-primary" onclick="openModal('modal-add-recipient')">+ Add Recipient</button>
    </div>
  </div>
  <div class="page-content">
    <div class="card">
      <div class="card-header">
        <h2>All Recipients</h2>
        <div class="search-bar" style="margin:0;">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="Search by name or phone..." oninput="filterTable()"/>
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Recipient</th><th>Gender</th><th>Age</th><th>Phone</th><th>Address</th></tr></thead>
          <tbody id="recipients-tbody"><tr><td colspan="6"><div class="loader"><div class="spinner"></div></div></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-add-recipient">
  <div class="modal">
    <div class="modal-header">
      <h3>🏥 Add New Recipient</h3>
      <button class="modal-close" onclick="closeModal('modal-add-recipient')">✕</button>
    </div>
    <div class="modal-body">
      <form id="form-add-recipient" onsubmit="addRecipient(event)">
        <div class="form-grid-2">
          <div class="form-row">
            <label>Full Name *</label>
            <input type="text" class="form-control" name="name" required/>
          </div>
          <div class="form-row">
            <label>Gender *</label>
            <select class="form-control" name="gender" required>
              <option value="">Select</option>
              <option>Male</option><option>Female</option><option>Other</option>
            </select>
          </div>
          <div class="form-row">
            <label>Age *</label>
            <input type="number" class="form-control" name="age" min="1" max="120" required/>
          </div>
          <div class="form-row">
            <label>Phone *</label>
            <input type="text" class="form-control" name="phone" placeholder="01XXXXXXXXX" required/>
          </div>
          <div class="form-row" style="grid-column:span 2;">
            <label>Address</label>
            <input type="text" class="form-control" name="address" placeholder="City, Area"/>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-add-recipient')">Cancel</button>
      <button class="btn btn-primary" onclick="document.getElementById('form-add-recipient').requestSubmit()">Save Recipient</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script><script src="js/recipients.js"></script>
</body></html>
