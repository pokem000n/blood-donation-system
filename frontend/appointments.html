<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Appointments — Blood Donation System</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo"><div class="logo-icon">🩸</div><h2>Blood Donation<br>Management</h2></div>
  <nav>
    <div class="nav-section">Main</div>
    <a href="index.html"        class="nav-link"><span class="icon">🏠</span> Dashboard</a>
    <div class="nav-section">Manage</div>
    <a href="donors.html"       class="nav-link"><span class="icon">👤</span> Donors</a>
    <a href="recipients.html"   class="nav-link"><span class="icon">🏥</span> Recipients</a>
    <a href="donations.html"    class="nav-link"><span class="icon">💉</span> Donations</a>
    <a href="inventory.html"    class="nav-link"><span class="icon">🩸</span> Blood Inventory</a>
    <div class="nav-section">Requests</div>
    <a href="requests.html"     class="nav-link"><span class="icon">📋</span> Blood Requests</a>
    <a href="emergency.html"    class="nav-link"><span class="icon">🚨</span> Emergency</a>
    <a href="appointments.html" class="nav-link"><span class="icon">📅</span> Appointments</a>
  </nav>
</aside>

<div class="main">
  <div class="topbar">
    <h1>📅 Appointments</h1>
    <div class="topbar-right">
      <button class="btn btn-primary" onclick="openModal('modal-add-appt')">+ Schedule Appointment</button>
    </div>
  </div>
  <div class="page-content">
    <div class="card">
      <div class="card-header">
        <h2>All Appointments</h2>
        <select id="filter-status" class="form-control" style="width:170px;" onchange="filterTable()">
          <option value="">All Statuses</option>
          <option>Scheduled</option><option>Completed</option><option>Cancelled</option>
        </select>
      </div>
      <div class="card-body" style="padding:0;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th><th>Donor</th><th>Donation Center</th>
                <th>Location</th><th>Date</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="appt-tbody">
              <tr><td colspan="7" class="loader"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Appointment Modal -->
<div class="modal-backdrop" id="modal-add-appt">
  <div class="modal">
    <div class="modal-header">
      <h3>📅 Schedule Appointment</h3>
      <button class="modal-close" onclick="closeModal('modal-add-appt')">✕</button>
    </div>
    <div class="modal-body">
      <form id="form-add-appt" onsubmit="addAppointment(event)">
        <div class="form-grid-2">
          <div class="form-row">
            <label>Donor *</label>
            <select class="form-control" name="donor_id" id="a-donor-select" required>
              <option value="">Loading...</option>
            </select>
          </div>
          <div class="form-row">
            <label>Donation Center *</label>
            <select class="form-control" name="center_id" id="a-center-select" required>
              <option value="">Loading...</option>
            </select>
          </div>
          <div class="form-row">
            <label>Appointment Date *</label>
            <input type="date" class="form-control" name="appointment_date" required/>
          </div>
          <div class="form-row">
            <label>Status *</label>
            <select class="form-control" name="status" required>
              <option value="Scheduled">Scheduled</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
        </div>
        <div class="modal-footer" style="padding:0;border:none;margin-top:16px;">
          <button type="button" class="btn btn-outline" onclick="closeModal('modal-add-appt')">Cancel</button>
          <button type="submit" class="btn btn-primary">Schedule</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script>
<script src="js/appointments.js"></script>
</body>
</html>
