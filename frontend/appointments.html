<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Appointments — HemoTrack</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title"><div class="page-icon">📅</div><h1>Appointments</h1></div>
    <div class="topbar-right">
      <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️</button>
      <select id="filter-status" class="filter-select" onchange="filterTable()">
        <option value="">All Statuses</option>
        <option>Scheduled</option><option>Completed</option><option>Cancelled</option>
      </select>
      <button class="btn btn-primary" onclick="openModal('modal-add-appt')">+ Schedule Appointment</button>
    </div>
  </div>
  <div class="page-content">
    <div class="card">
      <div class="card-header"><h2>All Appointments</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Donor</th><th>Donation Center</th><th>Location</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="appt-tbody"><tr><td colspan="7"><div class="loader"><div class="spinner"></div></div></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-add-appt">
  <div class="modal">
    <div class="modal-header">
      <h3>📅 Schedule Appointment</h3>
      <button class="modal-close" onclick="closeModal('modal-add-appt')">✕</button>
    </div>
    <div class="modal-body">
      <form id="form-add-appt" onsubmit="addAppointment(event)">
        <div class="form-grid-2">
          <div class="form-row"><label>Donor *</label><select class="form-control" name="donor_id" id="a-donor-select" required><option value="">Loading...</option></select></div>
          <div class="form-row"><label>Donation Center *</label><select class="form-control" name="center_id" id="a-center-select" required><option value="">Loading...</option></select></div>
          <div class="form-row"><label>Appointment Date *</label><input type="date" class="form-control" name="appointment_date" required/></div>
          <div class="form-row">
            <label>Status *</label>
            <select class="form-control" name="status" required>
              <option value="Scheduled">Scheduled</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-add-appt')">Cancel</button>
      <button class="btn btn-primary" onclick="document.getElementById('form-add-appt').requestSubmit()">Schedule</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script><script src="js/appointments.js"></script>
</body></html>
