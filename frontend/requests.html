<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Blood Requests — HemoTrack</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="sidebar-root"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title"><div class="page-icon">📋</div><h1>Blood Requests</h1></div>
    <div class="topbar-right">
      <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️</button>
      <select id="filter-status" class="filter-select" onchange="filterTable()">
        <option value="">All Statuses</option>
        <option>Pending</option><option>Approved</option><option>Fulfilled</option><option>Rejected</option><option>Cancelled</option>
      </select>
      <button class="btn btn-primary" onclick="openModal('modal-add-request')">+ New Request</button>
    </div>
  </div>
  <div class="page-content">
    <div class="card">
      <div class="card-header"><h2>All Blood Requests</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Recipient</th><th>Hospital</th><th>Blood Group</th><th>Qty (ml)</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="requests-tbody"><tr><td colspan="8"><div class="loader"><div class="spinner"></div></div></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal-add-request">
  <div class="modal">
    <div class="modal-header">
      <h3>📋 New Blood Request</h3>
      <button class="modal-close" onclick="closeModal('modal-add-request')">✕</button>
    </div>
    <div class="modal-body">
      <form id="form-add-request" onsubmit="addRequest(event)">
        <div class="form-grid-2">
          <div class="form-row"><label>Recipient *</label><select class="form-control" name="recipient_id" id="rec-select" required><option value="">Loading...</option></select></div>
          <div class="form-row"><label>Hospital *</label><select class="form-control" name="hospital_id" id="hosp-select" required><option value="">Loading...</option></select></div>
          <div class="form-row"><label>Blood Group *</label><select class="form-control" name="blood_group_id" id="bg-select" required><option value="">Loading...</option></select></div>
          <div class="form-row"><label>Quantity (ml) *</label><input type="number" class="form-control" name="quantity" value="450" min="100" required/></div>
          <div class="form-row"><label>Request Date *</label><input type="date" class="form-control" name="request_date" required/></div>
          <div class="form-row"><label>Status *</label><select class="form-control" name="status_id" id="status-select" required><option value="">Loading...</option></select></div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-add-request')">Cancel</button>
      <button class="btn btn-primary" onclick="document.getElementById('form-add-request').requestSubmit()">Submit</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/api.js"></script><script src="js/requests.js"></script>
</body></html>
